# Spring Boot Application Configuration for Axonique Backend

# Server Configuration

server.port=8080
server.servlet.context-path=/

# Database Configuration - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/axo_nique
spring.datasource.username=axo
spring.datasource.password=axo123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=false

# Application Name
spring.application.name=Axonique Backend API

# Logging
logging.level.root=INFO
logging.level.com.axonique_backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Mail Configuration (Placeholder for local testing)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.resend.api=re_buRJ3DzW_53HTmbYVh3FaUKSeQGVhpCDp
